bundle:
  name: nyc_taxi_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    default: workspace
  env:
    default: dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-31a437c9-e2c7.cloud.databricks.com
    variables:
      env: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-31a437c9-e2c7.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      env: prod
